[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "easy_vitessce"
version = "0.0.11"
authors = [
  {name="HIDIVE Lab"},
  {name="Selena Luo"}
]
description = "A package to easily use Vitessce to create interactive plots for single-cell data"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  'scipy>=1.2.1',
  'pandas>=1.1.2',
  'black>=21.11b1',
  'numpy>=1.21.2',
  'zarr>=3',
  'vitessce[all]>=3.9.1',
  'scanpy>=1.11.3',
  'anndata>=0.12.10',
  'spatialdata>=0.7.3',
  'spatialdata-plot>=0.4.0',
  'xarray>=2024.10.0',
  'donfig>=0.3.1',
]

[project.optional-dependencies]
docs = [
  'sphinx',
  'sphinx-book-theme',
  'sphinx-copybutton',
  'myst-parser',
  'nbsphinx',
]
dev = [
  'pytest>= 8.4.1',
  'jupyter',
  'jupyterlab',
  'pyyaml',
]


[tool.setuptools]
packages = ["easy_vitessce"]
package-dir = {"" = "src"}

[project.urls]
repository = "https://github.com/vitessce/easy_vitessce"


# Reference: https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--doctest-modules", "--verbose", "--ignore=docs"]
