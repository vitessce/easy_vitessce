name: Unit tests

# Reference: https://github.com/alex-page/alexpage.dev/commit/717efbcc57d0c8ce9f64d28526263610ea444823

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  unit_test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install vitessce
        run: uv sync --extra docs --extra dev
      - name: Run unit tests
        run: uv run pytest
      - name: Ensure that build works
        run: uv build --sdist --wheel
      - name: Cache example datasets for executed notebooks
        uses: actions/cache@v4
        with:
          path: docs/notebooks/data/*.zip
          key: notebook-data-${{ hashFiles('docs/notebooks/*_remote.ipynb') }}
          restore-keys: |
            notebook-data-
      - name: Ensure that docs build works
        run: uv run make html
